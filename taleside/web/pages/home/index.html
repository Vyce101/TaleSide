<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#032019">
  <title>TaleSide</title>
  <link rel="icon" type="image/png" sizes="48x48" href="/assets/brand/favicon/favicon-48x48.png">
  <link rel="preload" as="image" href="/assets/defaults/Default%20Background.png">
  <link rel="stylesheet" href="/assets/styles/base.css">
  <link rel="stylesheet" href="/pages/home/home.css">
  <script type="module" src="/pages/home/home.js"></script>
</head>
<body class="page-backdrop">
  <div class="hero-art" id="hero-art" aria-hidden="true"></div>
  <header class="top-bar">
    <nav aria-label="Sections">
      <span aria-current="page">Worlds</span>
      <a href="/create">Create</a>
    </nav>
    <div class="utilities">
      <button type="button" aria-label="Search" disabled>
        <svg viewBox="0 0 28 28" fill="none" stroke="currentColor" stroke-width="3.1" stroke-linecap="round" aria-hidden="true">
          <circle cx="11.5" cy="11" r="8.5"/><path d="m18 17.5 8 8"/>
        </svg>
      </button>
      <button type="button" aria-label="Settings" disabled>
        <svg viewBox="0 0 28 28" fill="currentColor" aria-hidden="true">
          <path fill-rule="evenodd" d="M11.8 1h4.4l.6 3.1 2.2.9 2.6-1.8 3.1 3.1-1.8 2.6.9 2.3 3.2.6v4.4l-3.2.6-.9 2.2 1.8 2.6-3.1 3.1-2.6-1.8-2.2.9-.6 3.2h-4.4l-.6-3.2-2.3-.9-2.6 1.8-3.1-3.1L5 19l-.9-2.2-3.1-.6v-4.4l3.1-.6.9-2.3-1.8-2.6 3.1-3.1L8.9 5l2.3-.9L11.8 1Zm2.2 7.2a5.8 5.8 0 1 0 0 11.6 5.8 5.8 0 0 0 0-11.6Z"/>
        </svg>
      </button>
    </div>
  </header>
  <main>
    <section class="empty" id="empty" aria-label="No Worlds">
      <div class="emblem-position">
        <svg class="ring" aria-hidden="true" overflow="visible">
          <circle cx="50%" cy="50%"/>
        </svg>
        <a class="emblem" href="/create" aria-label="Create a world">
          <img src="/assets/brand/Home%20Logo.png" width="800" height="800" alt="" draggable="false">
        </a>
      </div>
      <a href="/create" class="empty-label">Create a world.</a>
    </section>
    <section class="chooser" id="chooser" aria-label="Worlds" hidden>
      <button class="enter" id="enter" type="button" disabled hidden>Enter</button>
      <div class="worlds" id="worlds"></div>
    </section>
    <p class="message" id="message" role="status" hidden></p>
  </main>
  <aside class="preview-controls" aria-label="Temporary preview control">
    <select id="world-preview-mode" aria-label="Worlds preview">
      <option value="saved">My Worlds</option>
      <option value="demo">Demo Worlds</option>
      <option value="empty">No Worlds</option>
    </select>
  </aside>
</body>
</html>
